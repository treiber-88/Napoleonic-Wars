# Infantry. France and Britain share core stats; uniforms will differ once the Blender art is in.
# Placeholders: e1 (line and light), e2 (grenadiers).

FR_LIGNE:
	Inherits: ^LineInfantry
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~barracks, ~structures.france
		Description: actor-fr-ligne.description
	Tooltip:
		Name: actor-fr-ligne.name
	RenderSprites:
		Image: fr_ligne
	Formation:
		DeathSequences: die1, die2, die3

