# Cavalry: 30 riders, numerical value 60. Placeholder: RA dog sprite until the horse models exist.

^Dragoons:
	Inherits: ^Cavalry

^Cuirassiers:
	Inherits: ^Cavalry
	Valued:
		Cost: 1300
	Armor:
		Type: HeavyCavalry
	Mobile:
		Speed: 75
	Morale:
		LossPerPercent: 14
	VolleyArmament@SABRE:
		Weapon: HeavySabre

FR_DRAGOON:
	Inherits: ^Dragoons
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~barracks, ~structures.france
		Description: actor-fr-dragoon.description
	Tooltip:
		Name: actor-fr-dragoon.name
	RenderSprites:
		Image: fr_dragoon
	Formation:
		ShootSequence: shoot
		DeathSequences: die1, die2
	VolleyArmament@SABRE:
		ShootSequence: slash

