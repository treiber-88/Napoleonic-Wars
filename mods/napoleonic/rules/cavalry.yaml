# Cossacks: irregular light horse - fast and furious, lance and pistol, lighter and cheaper.
^Cossacks:
	Inherits: ^Cavalry
	Valued:
		Cost: 700
	Mobile:
		Speed: 125
	Morale:
		LossPerPercent: 26
	VolleyArmament@SABRE:
		Weapon: Lance

