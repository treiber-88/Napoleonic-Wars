# A neutral port for map makers: trade ships from every nation call here and bring $500 home to their ship yard.
TRADEPOST.NEUTRAL:
	Inherits: ^NWBuilding
	-Sellable:
	-Capturable:
	-CapturableProgressBar:
	-CapturableProgressBlink:
	-MustBeDestroyed:
	-GivesBuildableArea:
	-RequiresBuildableArea:
	Selectable:
		Bounds: 3072, 2048
	RenderSprites:
		Image: bld_tradingport
	Tooltip:
		Name: actor-tradepost-neutral.name
	Targetable:
		TargetTypes: WaterActor, Structure
	Building:
		Footprint: XXX xxx XXX
		Dimensions: 3,3
		TerrainTypes: Water
	Health:
		HP: 20000
	HitShape:
		Type: Rectangle
			TopLeft: -1536, -598
			BottomRight: 1536, 598
	TradingPost:
	MapEditorData:
		ExcludeTilesets: INTERIOR
		Categories: Trade

