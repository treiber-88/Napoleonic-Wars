# Napoleonic buildings. Placeholders use stock Red Alert structures:
# Headquarters, Barracks, Foundry, Ship Yard and Counting House use Blender art; the neutral port still uses RA's spen.

NWHQ:
	Inherits: ^NWBuilding
	Selectable:
		Bounds: 3072, 3072
	RenderSprites:
		Image: bld_headquarters
	Building:
		Footprint: xxX xxx XxX ===
		Dimensions: 3,4
		LocalCenterOffset: 0,-512,0
	HitShape:
		TargetableOffsets: 1273,939,0, -980,-640,0, -980,640,0
		Type: Rectangle
			TopLeft: -1536, -1536
			BottomRight: 1536, 1536
	Tooltip:
		Name: actor-nwhq.name
	# Any player can raise further headquarters (and replace a lost one while another still stands).
	Buildable:
		Queue: Building
		BuildPaletteOrder: 5
		Description: actor-nwhq.description
	Health:
		HP: 8000
	Valued:
		Cost: 3000
	Production:
		Produces: Building
	ProductionBar@Building:
		ProductionType: Building
	BaseBuilding:
	BaseProvider:
		PauseOnCondition: being-captured
		Range: 16c0
	ProvidesPrerequisite@france:
		Factions: france
		Prerequisite: structures.france
	ProvidesPrerequisite@england:
		Factions: england
		Prerequisite: structures.england
	ProvidesPrerequisite@russia:
		Factions: russia
		Prerequisite: structures.russia
	ProvidesPrerequisite@prussia:
		Factions: prussia
		Prerequisite: structures.prussia
	ProvidesPrerequisite@austria:
		Factions: austria
		Prerequisite: structures.austria
	ProvidesPrerequisite@buildingname:
	# Prussia - For the Fatherland: troops near a Prussian headquarters fight 10% harder.
	GrantConditionOnFaction@PRUSSIA:
		Condition: faction-prussia
		Factions: prussia
	ProximityExternalCondition@FATHERLAND:
		RequiresCondition: faction-prussia
		Condition: fatherland
		Range: 14c0

nwhq.colorpicker:
	Inherits: NWHQ
	-Buildable:
	-MapEditorData:
	-BaseBuilding:
	RenderSprites:
		Image: bld_headquarters
		Palette: colorpicker

BARRACKS:
	Inherits: ^NWBuilding
	Inherits@shape: ^2x2Shape
	Inherits@PRIMARY: ^PrimaryBuilding
	Selectable:
		Bounds: 2048, 2048
	RenderSprites:
		Image: bld_barracks
	Buildable:
		Queue: Building
		BuildPaletteOrder: 10
		Prerequisites: nwhq
		Description: actor-barracks.description
	Valued:
		Cost: 500
	Tooltip:
		Name: actor-barracks.name
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 3000
	RallyPoint:
		ForceSetType: Infantry
	CommandBarBlacklist:
		DisableStop: false
	Exit@1:
		RequiresCondition: !being-captured
		SpawnOffset: -42,810,0
		ExitCell: 1,2
	Production:
		Produces: Infantry, Vehicle, Cavalry
	ProductionBar:
		ProductionType: Infantry
	ProductionBar@Cavalry:
		ProductionType: Vehicle
		Color: 8A8A8A
	ProvidesPrerequisite@barracks:
		Prerequisite: barracks


